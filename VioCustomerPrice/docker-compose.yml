version: "3"

services:

  shopware:
    user: "${UID}:${GID}"
    image: dockware/dev:latest
    ports:
      - "80:80"
      - "3306:3306"
      - "22:22"
      - "8888:8888"
      - "9999:9999"
      - "9998:9998"
    volumes:
      - "db_volume:/var/lib/mysql"
      - "./:/var/www/html/custom/plugins/sw6-VioCustomerPrices"
    networks:
      - web
    environment:
      - XDEBUG_ENABLED=1

volumes:
  db_volume:
    driver: local

networks:
  web:
    external: false